map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        expires 6m;
        add_header Cache-Control "public";
    }

    # P1 fix: hyphenated alias for canonical concat slug (only where slug has no hyphen)
    rewrite ^/exams/jee-advanced/?$ /exams/jeeadvanced/ permanent;
    rewrite ^/exams/jee-main/?$    /exams/jeemain/    permanent;

    # AdSense compliance: canonical legal-page aliases (avoid soft-404 on common URLs)
    rewrite ^/privacy-policy/?$    /privacy/   permanent;
    rewrite ^/terms-of-service/?$  /terms/     permanent;
    rewrite ^/cookie-policy/?$     /privacy/   permanent;

    # Custom 404 — real 404 status, never a soft-404 homepage
    error_page 404 /404.html;
    location = /404.html { internal; }

    # HTML pages — edge-cacheable static output (Cloudflare respects s-maxage).
    # Browsers revalidate every 5m; CDN holds 30d. Purge CF cache on deploy.
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, s-maxage=2592000" always;
        try_files $uri =404;
    }

    # Root (avoids the directory-redirect block matching /)
    location = / {
        expires 5m;
        add_header Cache-Control "public, max-age=300, s-maxage=2592000" always;
        try_files /index.html =404;
    }

    # Already-slashed paths: serve the page's index.html or a real 404
    # (NEVER fall back to homepage — soft-404s fail AdSense review)
    location ~ ^/.+/$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, s-maxage=2592000" always;
        try_files $uri ${uri}index.html =404;
    }

    # Unslashed paths: redirect to slashed canonical, else real 404
    location / {
        if (-d $request_filename) {
            return 301 $forwarded_proto://$host$uri/;
        }
        try_files $uri $uri/ =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Permissions-Policy — disable powerful APIs we don't use (default deny).
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;

    # Content-Security-Policy — strict for own resources, opens the explicit
    # AdSense domains so the loader + ad iframes work once pub-ID lands. Keeps
    # the existing inline FOUC-prevention script via 'unsafe-inline' (Astro's
    # dark-mode toggle requires it; lock would break first paint).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://googletagservices.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; connect-src 'self' https://pagead2.googlesyndication.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
}

# www → apex canonical (after the default server so it doesn't shadow it).
# Catches direct www traffic if Cloudflare ever forwards it.
server {
    listen 80;
    server_name www.studyroadmap.in;
    return 301 https://studyroadmap.in$request_uri;
}
