# Cloudflare-aware static origin for studyroadmap.in
# Goals: correct single Cache-Control headers (s-maxage for edge), open_file_cache,
# real client IPs via CF-Connecting-IP, cheap static I/O.

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

# Shared security + ads headers.
# IMPORTANT: nginx does NOT inherit server-level add_header into a location that
# defines its own add_header (Cache-Control). Every location that sets headers
# must re-include these, or AdSense / browser security headers silently vanish.
# connect-src allows GA4 beacons + AdSense; script-src allows gtag + pagead.

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # --- Performance (static file serving) ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Cache open file descriptors / metadata (huge win for 3k+ static HTML pages)
    open_file_cache max=10000 inactive=120s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Prefer precompressed assets if present; otherwise gzip on the fly
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2
        application/manifest+json;

    # --- Cloudflare real IP (so logs + any rate limits see the visitor, not CF edge) ---
    # IPv4 — https://www.cloudflare.com/ips-v4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6 — https://www.cloudflare.com/ips-v6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # Traefik on the Docker network is the immediate peer
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Baseline security headers (apply when location does not redefine add_header)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://googletagservices.com https://www.googletagmanager.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;

    # Fingerprinted Astro assets — immutable, 1 year (edge + browser)
    # Do NOT use `expires` together with Cache-Control — nginx emits dual
    # Cache-Control headers which confuse Cloudflare origin TTL parsing.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://googletagservices.com https://www.googletagmanager.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
        access_log off;
    }

    # Static images / fonts / icons — 7d browser, 30d edge
    location ~* \.(svg|ico|png|jpg|jpeg|webp|gif|avif|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800, s-maxage=2592000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://googletagservices.com https://www.googletagmanager.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
        access_log off;
    }

    # Live news feed — short edge TTL so refresh-news.sh is visible soon
    location = /news.json {
        add_header Cache-Control "public, max-age=60, s-maxage=300" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://googletagservices.com https://www.googletagmanager.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
        try_files $uri =404;
    }

    # Static JSON (roadmap data etc.) — edge 1 day
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=300, s-maxage=86400" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://googletagservices.com https://www.googletagmanager.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
        try_files $uri =404;
    }

    # PWA manifest — correct MIME (was application/octet-stream via default)
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600, s-maxage=86400" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # Sitemaps + robots — edge 1 day (rebuilds on deploy; purge clears CF)
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=3600, s-maxage=86400" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://googletagservices.com https://www.googletagmanager.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
        try_files $uri =404;
    }

    # P1 fix: hyphenated alias for canonical concat slug (only where slug has no hyphen)
    rewrite ^/exams/jee-advanced/?$ /exams/jeeadvanced/ permanent;
    rewrite ^/exams/jee-main/?$    /exams/jeemain/    permanent;

    # AdSense compliance: canonical legal-page aliases (avoid soft-404 on common URLs)
    rewrite ^/privacy-policy/?$    /privacy/   permanent;
    rewrite ^/terms-of-service/?$  /terms/     permanent;
    rewrite ^/cookie-policy/?$     /privacy/   permanent;

    # SEO: common wrong subject slugs / legacy paths seen in bot+user 404 logs
    # (301 to nearest live hub so equity is not wasted on soft-404 HTML)
    rewrite ^/notes/nat-i/verbal/?$              /notes/nat-i/verbal-reasoning/ permanent;
    rewrite ^/notes/uii/subject_knowledge/?$     /notes/uii/subject-knowledge/ permanent;
    rewrite ^/notes/ican/verbal-reasoning/?$     /notes/ican/ permanent;
    rewrite ^/notes/gmat/mathematics/?$          /notes/gmat/ permanent;
    rewrite ^/notes/clat/surgery/?$              /notes/clat/ permanent;
    rewrite ^/exams/jee-adv/?$                   /exams/jeeadvanced/ permanent;
    rewrite ^/exams/neet-ug/?$                   /exams/neet/ permanent;
    rewrite ^/notes/neet/physics/moving-charges-and-magnetism/?$ /notes/neet/physics/ permanent;
    # Tier-2 / wrong-exam / wrong-subject aliases (bot+stale 404 log 2026-07-29)
    rewrite ^/notes/ssc-cgl-tier2/(.*)$           /notes/ssc-cgl/$1 permanent;
    rewrite ^/notes/nat-i/gs2/?$                 /notes/nat-i/ permanent;
    rewrite ^/notes/jamb/reasoning/?$            /notes/jamb/ permanent;
    rewrite ^/notes/gat/english/?$               /notes/gat/ permanent;
    rewrite ^/notes/ecat/qa/?$                   /notes/ecat/ permanent;
    rewrite ^/notes/uptet/indonesian/?$          /notes/uptet/ permanent;
    rewrite ^/notes/hat-ug/surgery/?$            /notes/hat-ug/ permanent;
    rewrite ^/notes/utbk/clinical-skills/?$      /notes/utbk/ permanent;
    rewrite ^/notes/buet-adm/mathematical-skills/?$ /notes/buet-adm/ permanent;
    rewrite ^/notes/ca-found/subject-clusters/?$ /notes/ca-found/ permanent;

    # Custom 404 — real 404 status, never a soft-404 homepage
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML pages — edge-cacheable static output (Cloudflare Cache Rule + s-maxage).
    # Browsers revalidate every 5m; CDN holds 30d. Purge CF cache on deploy.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, s-maxage=2592000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://googletagservices.com https://www.googletagmanager.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
        try_files $uri =404;
    }

    # Root (avoids the directory-redirect block matching /)
    location = / {
        add_header Cache-Control "public, max-age=300, s-maxage=2592000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://googletagservices.com https://www.googletagmanager.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
        try_files /index.html =404;
    }

    # Already-slashed paths: serve the page's index.html or a real 404
    # (NEVER fall back to homepage — soft-404s fail AdSense review)
    location ~ ^/.+/$ {
        add_header Cache-Control "public, max-age=300, s-maxage=2592000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), payment=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagservices.com https://googletagservices.com https://www.googletagmanager.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; connect-src 'self' https://pagead2.googlesyndication.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
        try_files $uri ${uri}index.html =404;
    }

    # Unslashed paths: redirect to slashed canonical, else real 404
    location / {
        if (-d $request_filename) {
            return 301 $forwarded_proto://$host$uri/;
        }
        try_files $uri $uri/ =404;
    }
}

# www → apex canonical (after the default server so it doesn't shadow it).
# Catches direct www traffic if Cloudflare ever forwards it.
server {
    listen 80;
    server_name www.studyroadmap.in;
    return 301 https://studyroadmap.in$request_uri;
}
