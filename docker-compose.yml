services:
  studyroadmap:
    build: .
    container_name: studyroadmap
    restart: unless-stopped
    # NOTE: previously bind-mounted ./news.json over the served file. Removed
    # 2026-06-01 after it caused a ~14h sitewide outage: when the host file went
    # missing, `docker compose up` auto-created ./news.json as an empty DIRECTORY,
    # and every subsequent start failed the bind mount (container stuck "created",
    # Traefik 404 sitewide). The mount was also abandoned — refresh-news.sh only
    # maintains public/news.json, which is baked into dist/ at build, so /news.json
    # is served correctly from the image with no fragile host bind mount.
    labels:
      - traefik.enable=true
      - "traefik.http.routers.studyroadmap.rule=Host(`studyroadmap.in`) || Host(`www.studyroadmap.in`)"
      - traefik.http.routers.studyroadmap.entrypoints=websecure
      - traefik.http.routers.studyroadmap.tls.certresolver=letsencrypt
      - traefik.http.services.studyroadmap.loadbalancer.server.port=80
    networks:
      - traefik-proxy

networks:
  traefik-proxy:
    external: true
