map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        expires 6m;
        add_header Cache-Control "public";
    }

    # P1 fix: hyphenated alias for canonical concat slug (only where slug has no hyphen)
    rewrite ^/exams/jee-advanced/?$ /exams/jeeadvanced/ permanent;
    rewrite ^/exams/jee-main/?$    /exams/jeemain/    permanent;

    # Root (avoids the directory-redirect block matching /)
    location = / {
        try_files /index.html =404;
    }

    # Already-slashed paths (avoids /roadmap/ → /roadmap// loop)
    location ~ ^/.+/$ {
        try_files $uri ${uri}index.html /index.html;
    }

    # Unslashed paths: redirect to slashed canonical via $forwarded_proto
    location / {
        if (-d $request_filename) {
            return 301 $forwarded_proto://$host$uri/;
        }
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
